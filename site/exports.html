<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>품목별 수출 추세</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f6f8;--paper:#fff;--ink:#1b2330;--mute:#5f6b7a;--line:#dde2e9;--accent:#1f4e8c;--up:#0f7b4f;--up-soft:#e0f3ea;--dn:#b3261e;--dn-soft:#fbe5e3;
  --display:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--paper:#171e27;--ink:#e6ebf2;--mute:#98a4b3;--line:#2a3440;--accent:#8db4ea;--up:#5fd3a0;--up-soft:#153227;--dn:#ff8a80;--dn-soft:#3d1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--paper:#171e27;--ink:#e6ebf2;--mute:#98a4b3;--line:#2a3440;--accent:#8db4ea;--up:#5fd3a0;--up-soft:#153227;--dn:#ff8a80;--dn-soft:#3d1c1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--display);padding:16px 16px 40px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
a{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.card h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{color:var(--mute);font-weight:400;font-size:12px;font-family:var(--mono)}
.big{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.big b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--mute)}
.pos{color:var(--up)} .neg{color:var(--dn)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.tag.up{background:var(--up-soft);color:var(--up)} .tag.dn{background:var(--dn-soft);color:var(--dn)}
svg{width:100%;height:56px;display:block}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);flex-wrap:wrap;gap:4px 10px}
.stocks{font-size:12.5px}
.stocks b{font-weight:500}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:500;background:var(--bg)}
.tw{overflow-x:auto}
footer{font-size:12px;color:var(--mute);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>품목별 수출 추세</h1><span class="sub" id="gen"></span><a href="./">← 배당 캘린더</a></header>
  <p class="sub" id="intro"></p>
  <section class="cards" id="cards"></section>
  <section class="tw" id="table"></section>
  <footer>
    출처: 관세청 품목별·국가별 수출입실적(공공데이터포털). API가 국가코드를 요구하므로 주요 수출국을 합산한 값이며 한국 전체 수출과는 차이가 있습니다(전년동월비는 같은 국가 집합끼리 비교).
    전월분이 매월 15일 전후에 반영됩니다. 관련 종목은 해당 품목 수출 비중이 큰 대표 상장사일 뿐, 수출 증가가 주가 상승을 보장하지 않습니다(시장이 먼저 반영하는 경우가 많음).
  </footer>
</div>
<script>
(async function(){
  let D; try { D = await (await fetch('exports.json?'+Date.now())).json(); } catch(e){ document.getElementById('cards').innerHTML='<p class="sub">exports.json이 아직 없습니다. GitHub Actions "관세청 수출 추세"를 실행하면 생성됩니다.</p>'; return; }
  const pct = v => v==null?'–':`<span class="${v<0?'neg':'pos'}">${v>0?'+':''}${v.toFixed(1)}%</span>`;
  const usd = v => (v/1e8).toLocaleString('ko-KR',{maximumFractionDigits:1})+'억$';
  document.getElementById('gen').textContent = `최신 ${D.latest_month} · 갱신 ${D.generated_at.slice(0,16).replace('T',' ')}`;
  document.getElementById('intro').textContent = `주요 ${D.countries.length}개국 합산 월별 수출금액. 카드는 전년동월비 순, 선은 최근 24개월 추이.`;
  const spark = s => { const ks=Object.keys(s).slice(-24); const v=ks.map(k=>s[k]); const mn=Math.min(...v), mx=Math.max(...v); const W=300,H=56;
    const pts=v.map((x,i)=>`${(i/(v.length-1))*W},${H-4-((x-mn)/((mx-mn)||1))*(H-8)}`).join(' ');
    const last12=v.length-12; return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--mute)" stroke-width="1.5" points="${pts}"/><line x1="${(Math.max(0,last12)/(v.length-1))*W}" y1="0" x2="${(Math.max(0,last12)/(v.length-1))*W}" y2="${H}" stroke="var(--line)" stroke-dasharray="3 3"/></svg>`; };
  document.getElementById('cards').innerHTML = D.items.map(r => `<div class="card">
    <h2><span>${r.name}</span><small>HS ${r.hs}</small></h2>
    <div class="big"><b>${usd(r.latest_usd)}</b><span>${D.latest_month}</span><b>${pct(r.yoy)}</b><span>전년동월비</span>${r.streak_up>=3?`<span class="tag up">${r.streak_up}개월 연속 증가</span>`:''}${r.yoy!=null&&r.yoy_3m_avg!=null&&r.yoy>r.yoy_3m_avg&&r.yoy>0?'<span class="tag up">가속</span>':''}${r.yoy!=null&&r.yoy<0&&r.yoy_3m_avg!=null&&r.yoy<r.yoy_3m_avg?'<span class="tag dn">둔화</span>':''}</div>
    ${spark(r.series)}
    <div class="row"><span>전월비 ${pct(r.mom)}</span><span>3개월 평균 전년비 ${pct(r.yoy_3m_avg)}</span><span>상위국 ${r.top_countries.slice(0,3).map(c=>`${c.cnty} ${c.yoy>0?'+':''}${c.yoy}%`).join(' · ')}</span></div>
    <div class="stocks">관련: ${Object.entries(r.stocks).map(([c,n])=>`<b>${n}</b>`).join(', ')}</div>
  </div>`).join('');
  const months = Object.keys(D.items[0].series).slice(-13);
  document.getElementById('table').innerHTML = `<table><thead><tr><th>품목</th>${months.map(m=>`<th>${m.slice(2)}</th>`).join('')}</tr></thead><tbody>` +
    D.items.map(r=>`<tr><td>${r.name}</td>${months.map(m=>`<td>${r.series[m]!=null?(r.series[m]/1e8).toFixed(1):'–'}</td>`).join('')}</tr>`).join('') + '</tbody></table><p class="sub">단위: 억$</p>';
})();
</script>
</body>
</html>
